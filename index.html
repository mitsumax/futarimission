<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ふたりミッション</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f0675a">
<meta name="description" content="知らない誰かと、ふたりでひとつのゲームに挑戦。話しながら協力してクリアしよう。登録不要。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6f1; --panel:#ffffff; --ink:#3a2b2b; --muted:#9a8580; --line:#f1ddd4;
  --coral:#f0675a; --coral2:#ffb199; --teal:#2f9c8f; --sky:#5b8def; --gold:#f2b134;
  --m:#5b8def; --f:#ec6a9c;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#211a1a; --panel:#2c2323; --ink:#f6ebe7; --muted:#b29f99; --line:#41322f; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"M PLUS Rounded 1c",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;border-radius:14px;padding:10px 16px;font-weight:800;background:var(--coral);color:#fff;transition:transform .08s}
button:active{transform:scale(.97)}
button.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
button.soft{background:var(--bg);border:1.5px solid var(--line);color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
input[type=text]{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;outline:none;width:100%}
input[type=text]:focus{border-color:var(--coral)}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
/* ---------- intro ---------- */
#intro,#lobbyScr{align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.hero{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(240,103,90,.12)}
.logo{font-size:28px;font-weight:800;text-align:center;line-height:1.2}
.logo span{color:var(--coral)}
.tag{font-size:13px;color:var(--muted);text-align:center;line-height:1.7;margin-top:-4px}
.label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.gender{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.gender button.sel.n{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,transparent)}
.linkbtn{background:none;border:none;padding:0;color:var(--coral);font-weight:700;text-decoration:underline;font-size:inherit}
.rules{text-align:left;font-size:13px;line-height:1.7;margin:0;padding-left:1.2em}
.gender button{background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:12px}
.gender button.sel.m{border-color:var(--m);background:color-mix(in srgb,var(--m) 14%,transparent)}
.gender button.sel.f{border-color:var(--f);background:color-mix(in srgb,var(--f) 14%,transparent)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--coral)}
.games-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gp{background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center;font-size:11px;color:var(--muted)}
.gp b{display:block;font-size:22px;margin-bottom:2px}
.note{font-size:11px;color:var(--muted);text-align:center;line-height:1.6}
/* lobby */
.radar{width:150px;height:150px;border-radius:50%;margin:6px auto;position:relative;background:radial-gradient(circle,color-mix(in srgb,var(--coral) 20%,transparent),transparent 70%)}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--coral);animation:ping 2s ease-out infinite;opacity:0}
.radar::after{animation-delay:1s}
@keyframes ping{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.15);opacity:0}}
.radar .c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px}
.stat{display:flex;justify-content:center;gap:16px;font-size:13px;color:var(--muted)}
.stat b{font-size:18px;color:var(--ink)}
/* ---------- play ---------- */
#playScr{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr)}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.partner{display:flex;align-items:center;gap:8px;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none}
.partner .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.partner .sub{font-size:11px;color:var(--muted)}
.bond{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.bondbar{width:90px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bondbar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral2),var(--coral));width:0;transition:width .6s}
.topbar button{padding:7px 10px;font-size:12px;white-space:nowrap;flex:none}
.bond{white-space:nowrap;flex:none}
.partner .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){ .bond .bl{display:none} }
.stage{overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center}
.stage-inner{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.chat{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
@media (max-width:820px){
  #playScr{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1.7fr) minmax(0,1fr)}
  #playScr .mazewrap{max-width:min(420px,28vh)}
  #playScr .card{padding:12px}
  #playScr .pad{grid-template-rows:repeat(2,46px)}
  .chat{border-left:none;border-top:1px solid var(--line)}
  .bondbar{width:56px}
  .stage{padding:12px}
}
.log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:0}
.msg{max-width:85%;display:flex;flex-direction:column}
.msg .bubble{padding:8px 12px;border-radius:16px;background:var(--bg);border:1px solid var(--line);word-break:break-word;line-height:1.5;font-size:14px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.mine .bubble{background:var(--coral);color:#fff;border-color:transparent}
.msg .t{font-size:10px;color:var(--muted);margin:2px 4px}
.sys{align-self:center;font-size:11px;color:var(--muted);text-align:center;padding:2px 10px;background:var(--bg);border-radius:99px}
.quick{display:flex;gap:6px;padding:6px 10px 0;overflow-x:auto;scrollbar-width:none}
.quick button{flex:none;padding:5px 10px;font-size:12px;border-radius:99px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:700}
.compose{display:flex;gap:8px;padding:8px 10px 10px}
.compose input{flex:1}
.compose button{padding:10px 14px}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
.h{font-size:18px;font-weight:800;margin:0}
.sub{font-size:13px;color:var(--muted);line-height:1.6}
.role{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.gamegrid{display:grid;gap:10px}
.gamecard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:18px;padding:14px}
.gamecard .ic{font-size:32px;width:52px;height:52px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.gamecard b{display:block;font-size:16px}
.gamecard span{font-size:12px;color:var(--muted);font-weight:400;line-height:1.5}
.progress{display:flex;gap:5px;justify-content:center}
.progress i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.progress i.ok{background:var(--coral)} .progress i.ng{background:var(--muted)} .progress i.cur{outline:2px solid var(--coral);outline-offset:2px}
.qtext{font-size:20px;font-weight:800;text-align:center;margin:6px 0 2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:14px 8px;border-radius:16px;font-weight:700;min-height:58px}
.opt.mine{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,transparent)}
.opt.theirs{box-shadow:inset 0 0 0 3px var(--teal)}
.reveal{text-align:center;font-weight:800;font-size:18px}
.center{text-align:center}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* lock */
.code{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:56px;height:56px;border-radius:14px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;background:var(--bg)}
.slot.done{border-style:solid;border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent)}
.slot.next{border-color:var(--coral);border-style:solid}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{background:var(--bg);border:2px solid var(--line);border-radius:14px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:6px}
.key svg,.slot svg{width:70%;height:70%}
.hearts{font-size:18px;letter-spacing:2px}
/* maze */
.mazewrap{width:100%;max-width:420px;margin:0 auto;aspect-ratio:1;position:relative}
.mazewrap canvas{width:100%;height:100%;border-radius:16px;display:block;background:var(--panel)}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center}
.pad button{font-size:22px;padding:0}
.pad .u{grid-column:2} .pad .l{grid-column:1;grid-row:2} .pad .d{grid-column:2;grid-row:2} .pad .r{grid-column:3;grid-row:2}
.big{font-size:54px;text-align:center;line-height:1}
.overlay{position:fixed;inset:0;background:rgba(30,15,15,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.dialog{background:var(--panel);border-radius:22px;padding:22px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.confetti{position:fixed;top:-20px;font-size:22px;animation:fall 2.4s linear forwards;pointer-events:none;z-index:30}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>

<!-- ============ INTRO ============ -->
<section class="screen" id="intro">
  <form class="hero" id="introForm">
    <div class="logo">ふたり<span>ミッション</span></div>
    <div class="tag">知らない誰かと、ふたりでひとつのゲームに挑戦。<br>話しながら協力してクリアするうちに、気づけば仲良くなっている。</div>
    <div class="games-preview">
      <div class="gp"><b>💞</b>以心伝心</div>
      <div class="gp"><b>🔐</b>記号ロック</div>
      <div class="gp"><b>🌫️</b>霧の迷路</div>
    </div>
    <div>
      <div class="label">ニックネーム</div>
      <input type="text" id="nameIn" maxlength="12" placeholder="例: はる" required>
    </div>
    <div>
      <div class="label">あなたの性別（相手に表示されます）</div>
      <div class="gender">
        <button type="button" class="m" data-g="m">男性</button>
        <button type="button" class="f" data-g="f">女性</button>
        <button type="button" class="n" data-g="n">ひみつ</button>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="ageIn" required> <span><button type="button" class="linkbtn" id="rulesBtn">あそびのルール</button>に同意します（出会い目的の利用・連絡先の交換は禁止）</span></label>
    <button type="submit" id="startBtn">はじめる（登録不要）</button>
    <div class="note" id="introNote">登録は不要。相手は性別に関係なくランダムに決まります。<br>チャットはゲームが終わると消え、どこにも保存されません。</div>
  </form>
</section>

<!-- ============ LOBBY ============ -->
<section class="screen hidden" id="lobbyScr">
  <div class="hero">
    <div class="logo" style="font-size:22px">いっしょに遊ぶ人を探しています…</div>
    <div class="radar"><div class="c" id="radarIc">💌</div></div>
    <div class="stat">
      <div>いま相手を探している人 <b id="cntW">1</b></div>
    </div>
    <div class="tag" id="lobbyMsg">相手が見つかると、自動でつながります。</div>
    <button class="ghost" id="cancelBtn" type="button">やめる</button>
  </div>
</section>

<!-- ============ PLAY ============ -->
<section class="screen hidden" id="playScr">
  <div class="topbar">
    <div class="partner">
      <div class="avatar" id="pAv">?</div>
      <div style="min-width:0"><div class="nm" id="pName">…</div><div class="sub" id="pSub">相手</div></div>
    </div>
    <div class="bond" title="一緒にクリアするほど貯まります"><span class="bl">仲良し度</span><div class="bondbar"><i id="bondFill"></i></div><b id="bondLv">Lv1</b></div>
    <button class="ghost" id="leaveBtn" type="button">退出</button>
  </div>
  <div class="stage"><div class="stage-inner" id="stage"></div></div>
  <aside class="chat">
    <div class="log" id="log"></div>
    <div class="quick" id="quick"></div>
    <form class="compose" id="compose">
      <input type="text" id="msgIn" placeholder="メッセージ…" maxlength="200" autocomplete="off">
      <button type="submit">送信</button>
    </form>
  </aside>
</section>

<div class="overlay hidden" id="ovl"><div class="dialog" id="ovlBox"></div></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
const sess = { get(k){try{return sessionStorage.getItem(k)}catch(e){return null}}, set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}} };
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd = n => Math.floor(Math.random()*n);
const uid = () => Math.random().toString(36).slice(2,10);

const GAMES = {
  kokoro:{ic:"💞",name:"以心伝心",desc:"同じ質問にふたりで答えて、6問中4問そろえばクリア。選んだあとに理由を話してみよう。"},
  lock:  {ic:"🔐",name:"記号ロック",desc:"片方だけに暗号が見える。言葉で伝えて、もう片方が入力。3つのロックを解除しよう。"},
  maze:  {ic:"🌫️",name:"霧の迷路",desc:"地図が見えるナビ役と、まわりしか見えない探検役。声かけだけでゴールを目指そう。"},
};
const QUICK = ["よろしくね！","ナイス！👏","ごめん🙏","ありがとう！","どれにする？","😊","🤣","👍"];

/* ---------------- state ---------------- */
let me = { name: store.get("fm-name")||"", g: store.get("fm-g")||"" };
let ws = null, connected = false, token = sess.get("fm-token") || "", retry = 0, wantSearch = false;
let partner = null, V = null, lastResultId = null, screen = "intro";

/* ---------------- screens ---------------- */
function show(id){ screen=id; ["intro","lobbyScr","playScr"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); }

/* ---------------- connection ---------------- */
function connect(){
  const proto = location.protocol==="https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws${token?`?token=${token}`:""}`);
  ws.onopen = () => { connected=true; retry=0; setConn(true); };
  ws.onmessage = e => { let m; try{ m=JSON.parse(e.data); }catch(err){ return; } onMsg(m); };
  ws.onclose = ev => {
    connected=false; setConn(false);
    if(ev.code===4003 || ev.code===4001) return;            // banned / replaced by another tab
    const wait = Math.min(8000, 500*Math.pow(2, retry++));
    setTimeout(connect, wait);
  };
}
function send(m){ if(ws && ws.readyState===1) ws.send(JSON.stringify(m)); }
function setConn(ok){
  let bar = $("connBar");
  if(!bar){ bar=document.createElement("div"); bar.id="connBar"; bar.style.cssText="position:fixed;top:0;left:0;right:0;z-index:40;background:#3a2b2b;color:#fff;font-size:12px;text-align:center;padding:6px;font-weight:700"; document.body.appendChild(bar); }
  bar.textContent = "接続が切れました。再接続しています…";
  bar.style.display = ok ? "none" : "block";
}

function onMsg(m){
  switch(m.t){
    case "hello":
      token = m.token; sess.set("fm-token", token);
      if(m.state==="paired") return; // "matched" follows
      if(m.state==="wait"){ show("lobbyScr"); return; }
      // the server no longer knows us (restart / long disconnect)
      if(screen==="lobbyScr" && me.name){ wantSearch=true; send({t:"profile", name:me.name, g:me.g}); }
      else if(screen==="playScr"){ partner=null; show("intro"); note("接続が長く切れたため、ゲームが終了しました。もう一度はじめてください。", true); }
      else if(wantSearch && me.name){ send({t:"profile", name:me.name, g:me.g}); }
      return;
    case "profile_ok":
      me.name=m.name; me.g=m.g; store.set("fm-name",me.name); store.set("fm-g",me.g);
      if(wantSearch){ wantSearch=false; send({t:"search"}); }
      return;
    case "error":
      wantSearch=false;
      if(screen!=="intro") show("intro");
      note(m.text, true); return;
    case "searching": startLobbyUI(); return;
    case "stats": $("cntW").textContent = m.waiting; return;
    case "matched":
      partner = m.partner; V=null;
      if(!m.resumed){ $("log").textContent=""; sys("マッチングしました！まずは「よろしく」から始めよう 👋"); sys("連絡先の交換・出会い目的の利用は禁止です"); }
      else sys("再接続しました");
      renderTop(); renderStage(); show("playScr"); return;
    case "view":
      V = m.view;
      if(V.result && V.result.id!==lastResultId){ lastResultId=V.result.id; if(V.result.clear) confetti(); }
      renderTop(); renderStage(); return;
    case "sys": sys(m.text); return;
    case "chat": addMsg(m.text, m.from==="me", m.ts); return;
    case "chat_rejected": sys("🚫 "+m.text); return;
    case "partner_away": sys(`${partner?partner.name:"相手"} さんの接続が不安定です…少し待ってね`); $("pSub").textContent="接続待ち…"; return;
    case "partner_back": sys(`${partner?partner.name:"相手"} さんが戻ってきました`); renderTop(); return;
    case "partner_left": {
      const nm = partner ? partner.name : "相手";
      const txt = m.reason==="disconnected" ? `${esc(nm)} さんとの接続が切れました` : `${esc(nm)} さんが退出しました`;
      openDialog(`<div class="big">👋</div><div class="h">${txt}</div><div class="sub">一緒に遊んでくれてありがとう。</div>
        <button id="dNext">新しい相手を探す</button><button class="ghost" id="dHome">トップへ</button>`);
      $("dNext").onclick=()=>{ closeDialog(); send({t:"search"}); };
      $("dHome").onclick=()=>{ closeDialog(); show("intro"); };
      partner=null; return;
    }
    case "left":
      if(m.reported) toast("通報を受け付けました。ご協力ありがとうございます。");
      return;
    case "banned":
      show("intro"); note("規約違反の通報が複数あったため、しばらく利用できません。", true); return;
    case "replaced":
      show("intro"); note("別のタブで開かれたため、こちらは切断しました。", true); return;
  }
}

/* ---------------- intro ---------------- */
$("nameIn").value = me.name;
function paintGender(){ document.querySelectorAll(".gender button").forEach(b=>b.classList.toggle("sel", b.dataset.g===me.g)); }
document.querySelectorAll(".gender button").forEach(b=>b.onclick=()=>{ me.g=b.dataset.g; paintGender(); });
paintGender();
function note(text, warn){ $("introNote").textContent=text; $("introNote").style.color = warn?"var(--coral)":""; }
$("rulesBtn").onclick=()=>{
  openDialog(`<div class="h">あそびのルール</div>
  <ul class="rules">
    <li>このアプリは、ふたりで協力してゲームをクリアするためのものです。</li>
    <li>出会い・恋愛・交際を目的とした利用は禁止です。</li>
    <li>電話番号・メールアドレス・SNSやメッセージアプリのIDなど、連絡先の交換は禁止です（自動でブロックされます）。</li>
    <li>相手が嫌がることや、悪口・性的な発言は禁止です。</li>
    <li>いやな思いをしたら「退出」→「通報して退出」を使ってください。複数の通報があった利用者は利用できなくなります。</li>
    <li>チャットは保存されません（通報があった場合のみ、確認のため直近の会話が記録されます）。</li>
  </ul><button id="dOk">わかった</button>`);
  $("dOk").onclick=closeDialog;
};
$("introForm").addEventListener("submit", e=>{
  e.preventDefault();
  const n = $("nameIn").value.trim().slice(0,12);
  if(!n) return;
  if(!["m","f","n"].includes(me.g)){ note("性別を選んでください（「ひみつ」も選べます）", true); return; }
  if(!$("ageIn").checked) return;
  me.name = n;
  if(!connected){ note("サーバーに接続しています…少し待ってからもう一度押してください", true); return; }
  wantSearch = true;
  send({t:"profile", name:me.name, g:me.g});
});

/* ---------------- play: leave / report ---------------- */
$("leaveBtn").onclick=()=>{

    <button id="dLeave">退出して新しい相手を探す</button>

function reportDialog(){
  const reasons=["連絡先を聞かれた・出会い目的だった","悪口・いやがらせ","性的な発言","その他"];
  openDialog(`<div class="h">通報する理由</div><div class="sub">相手とは二度とマッチングしなくなります。</div>
    ${reasons.map((r,i)=>`<button class="soft" data-r="${i}">${r}</button>`).join("")}
    <button class="ghost" id="dCancel">キャンセル</button>`);

/* ---------------- render ---------------- */
function renderTop(){
  if(!partner) return;
  $("pName").textContent = partner.name;
  $("pSub").textContent = ({m:"男性",f:"女性",n:"性別ひみつ"}[partner.g]||"")+" · いっしょにプレイ中";
  $("pAv").textContent = partner.name.slice(0,1);
  $("pAv").style.background = partner.g==="f" ? "var(--f)" : partner.g==="m" ? "var(--m)" : "var(--teal)";
  const b = V ? V.bond : 0;
  $("bondLv").textContent = "Lv" + (1+Math.floor(b/50));
  $("bondFill").style.width = ((b%50)/50*100)+"%";
}
function act(a){ send({t:"act", a}); }
function glyph(id){
  const shape=id%4, mark=Math.floor(id/4), c="currentColor"; let s="";
  if(shape===0) s=`<circle cx="20" cy="20" r="16" fill="none" stroke="${c}" stroke-width="3"/>`;
  if(shape===1) s=`<polygon points="20,4 36,34 4,34" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>`;
  if(shape===2) s=`<rect x="5" y="5" width="30" height="30" rx="3" fill="none" stroke="${c}" stroke-width="3"/>`;
  if(shape===3) s=`<polygon points="20,3 37,20 20,37 3,20" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>`;
  const cy = shape===1 ? 24 : 20;
  if(mark===0) s+=`<circle cx="20" cy="${cy}" r="3.5" fill="${c}"/>`;
  if(mark===1) s+=`<line x1="13" y1="${cy}" x2="27" y2="${cy}" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`;
  if(mark===2) s+=`<path d="M15 ${cy-5}L25 ${cy+5}M25 ${cy-5}L15 ${cy+5}" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 40 40">${s}</svg>`;
}
function renderStage(){
  const st=$("stage");
  if(!V){ st.innerHTML=`<div class="card center"><div class="big">⏳</div><div class="sub">準備中…</div></div>`; return; }
  if(V.phase==="select") return renderSelect(st);
  if(V.phase==="result") return renderResult(st);
  if(V.game==="kokoro") return renderKokoro(st);
  if(V.game==="lock") return renderLock(st);
  if(V.game==="maze") return renderMaze(st);
}
function renderSelect(st){
  st.innerHTML = `<div class="card"><p class="h">どれに挑戦する？</p><div class="sub">どちらが選んでもOK。チャットで相談してから決めよう。${V.clears?`<br>これまでのクリア: <b>${V.clears}</b>回`:""}</div></div>
  <div class="gamegrid">${Object.entries(GAMES).map(([k,g])=>`<button class="gamecard" data-g="${k}"><div class="ic">${g.ic}</div><div><b>${g.name}</b><span>${g.desc}</span></div></button>`).join("")}</div>`;
  st.querySelectorAll(".gamecard").forEach(b=>b.onclick=()=>act({type:"pick", game:b.dataset.g}));
}
function renderResult(st){
  const r=V.result, g=GAMES[r.game];
  st.innerHTML = `<div class="card center" style="display:flex;flex-direction:column;gap:12px">
    <div class="big">${r.clear?"🎉":"🤝"}</div>
    <p class="h">${r.clear?"ミッションクリア！":"おしい！"}</p>
    <div class="sub">${g.ic} ${g.name}<br>${esc(r.text)}</div>
    <div class="sub">${r.clear?"ふたりの息がぴったり！ 仲良し度 +25":"いっしょに挑戦して 仲良し度 +8"}</div>
    <div class="row"><button id="again">もう一度</button><button class="soft" id="menu">ほかのゲーム</button></div></div>`;
  $("again").onclick=()=>act({type:"again"});
  $("menu").onclick=()=>act({type:"menu"});
}
function renderKokoro(st){
  const P=V.play;
  const dots = Array.from({length:P.total},(_,i)=>`<i class="${i<P.hist.length?(P.hist[i]?"ok":"ng"):(i===P.i?"cur":"")}"></i>`).join("");
  const matches = P.hist.reduce((s,v)=>s+v,0);
  let status;
  if(P.reveal) status = P.mine===P.theirs ? `<div class="reveal" style="color:var(--coral)">💞 そろった！</div>` : `<div class="reveal" style="color:var(--muted)">ちがった！どうしてそれを選んだの？</div>`;
  else if(P.mine!==null) status = `<div class="sub center">相手が選ぶのを待っています…</div>`;
  else status = `<div class="sub center">${P.theirsDone?"相手はもう選んだよ！":"相手の答えを予想して選ぼう"}（選ぶ前に答えを言うのはナシ）</div>`;
  st.innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="row" style="justify-content:space-between"><span class="role">💞 以心伝心</span><span class="sub">そろった数 <b>${matches}</b> / 目標 ${P.goal}</span></div>
    <div class="progress">${dots}</div>
    <div class="qtext">Q${P.i+1}. ${esc(P.q)}</div>
    <div class="opts">${P.opts.map((o,i)=>`<button class="opt ${P.mine===i?"mine":""} ${P.reveal&&P.theirs===i?"theirs":""}" data-i="${i}" ${P.mine!==null?"disabled":""}>${esc(o)}</button>`).join("")}</div>
    ${status}
    ${P.reveal?`<div class="sub center"><span style="color:var(--coral)">■</span> あなた　<span style="color:var(--teal)">■</span> ${esc(partner?partner.name:"相手")}さん</div><div class="row"><button id="next">${P.i+1>=P.total?"結果を見る":"次の質問へ"}</button></div>`:""}
  </div>`;
  st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>act({type:"ans", q:P.i, c:+b.dataset.i}));
  if(P.reveal) $("next").onclick=()=>act({type:"next", q:P.i});
}
function renderLock(st){
  const P=V.play;
  const hearts = "❤️".repeat(P.maxMiss-P.miss)+"🤍".repeat(P.miss);
  const slots = Array.from({length:P.len},(_,i)=>{
    const g = P.instr ? glyph(P.code[i]) : (i<P.input ? glyph(P.entered[i]) : "");
    return `<div class="slot ${i<P.input?"done":""} ${i===P.input?"next":""}">${g}</div>`;
  }).join("");
  const body = P.instr
    ? `<div class="sub center">あなたは <b>伝える役</b>。この記号を順番に、言葉だけで伝えよう。<br>（例:「三角の中に点」）</div><div class="code">${slots}</div><div class="sub center">相手のボタンの並び順はあなたと違います</div>`
    : `<div class="sub center">あなたは <b>入力する役</b>。相手の説明を聞いて、正しい記号を順番に押そう。</div><div class="code">${slots}</div>
       <div class="keys">${P.layout.map(s=>`<button class="key" data-s="${s}" style="color:var(--ink)">${glyph(s)}</button>`).join("")}</div>`;
  st.innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="row" style="justify-content:space-between"><span class="role">🔐 ロック ${P.round+1} / ${P.rounds}</span><span class="hearts" title="ミスできる回数">${hearts}</span></div>${body}</div>`;
  st.querySelectorAll(".key").forEach(b=>b.onclick=()=>act({type:"press", s:+b.dataset.s, r:P.round}));
}
function renderMaze(st){
  const P=V.play;
  st.innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="row" style="justify-content:space-between"><span class="role">🌫️ ${P.nav?"ナビ役":"探検役"}</span><span class="sub">歩数 <b>${P.moves}</b>　ぶつかった <b>${P.bumps}</b>/${P.maxBumps}</span></div>
    <div class="sub center">${P.nav?"あなたには迷路全体が見えます。探検役を🏁まで道案内しよう！":"まわりしか見えません。ナビ役の指示を聞いて進もう！"}</div>
    <div class="mazewrap"><canvas id="mz" width="640" height="640"></canvas></div>
    ${P.nav?"":`<div class="pad"><button class="u" data-d="n">↑</button><button class="l" data-d="w">←</button><button class="d" data-d="s">↓</button><button class="r" data-d="e">→</button></div>`}
  </div>`;
  drawMaze($("mz"), P);
  st.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>act({type:"move", d:b.dataset.d, m:P.moves+P.bumps}));
}
function drawMaze(cv, P){
  const ctx=cv.getContext("2d"), w=P.w, S=640, pad=20, c=(S-pad*2)/w;
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  ctx.fillStyle = dark?"#2c2323":"#fff"; ctx.fillRect(0,0,S,S);
  for(let y=0;y<w;y++) for(let x=0;x<w;x++){
    const X=pad+x*c, Y=pad+y*c, v=P.cells[y*w+x];
    if(v===null){ ctx.fillStyle = dark?"#3a2f2d":"#e9e2df"; ctx.fillRect(X,Y,c+1,c+1); continue; }
    ctx.strokeStyle = dark?"#f6ebe7":"#3a2b2b"; ctx.lineWidth=5; ctx.lineCap="round";
    ctx.beginPath();
    if(v&1){ctx.moveTo(X,Y);ctx.lineTo(X+c,Y);}
    if(v&2){ctx.moveTo(X+c,Y);ctx.lineTo(X+c,Y+c);}
    if(v&4){ctx.moveTo(X,Y+c);ctx.lineTo(X+c,Y+c);}
    if(v&8){ctx.moveTo(X,Y);ctx.lineTo(X,Y+c);}
    ctx.stroke();
  }
  ctx.font=`${c*.6}px sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle";
  if(P.goal>=0) ctx.fillText("🏁", pad+(P.goal%w)*c+c/2, pad+Math.floor(P.goal/w)*c+c/2);
  ctx.fillText("🧭", pad+(P.pos%w)*c+c/2, pad+Math.floor(P.pos/w)*c+c/2);
}

/* ---------------- chat ---------------- */
function addMsg(text, mine, ts){
  const el=document.createElement("div"); el.className="msg"+(mine?" mine":"");
  const b=document.createElement("div"); b.className="bubble"; b.textContent=text;
  const t=document.createElement("div"); t.className="t"; t.textContent=new Date(ts||Date.now()).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  el.append(b,t); $("log").appendChild(el); $("log").scrollTop=$("log").scrollHeight;
}
function sys(text){ const el=document.createElement("div"); el.className="sys"; el.textContent=text; $("log").appendChild(el); $("log").scrollTop=$("log").scrollHeight; }
function sendChat(text){ text=String(text).trim().slice(0,200); if(text) send({t:"chat", text, id:uid()}); }
$("compose").addEventListener("submit", e=>{ e.preventDefault(); sendChat($("msgIn").value); $("msgIn").value=""; });
QUICK.forEach(q=>{ const b=document.createElement("button"); b.type="button"; b.textContent=q; b.onclick=()=>sendChat(q); $("quick").appendChild(b); });

/* ---------------- ui helpers ---------------- */
function openDialog(html){ $("ovlBox").innerHTML=html; $("ovl").classList.remove("hidden"); }
function closeDialog(){ $("ovl").classList.add("hidden"); }
function toast(text){ const t=document.createElement("div"); t.textContent=text; t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3a2b2b;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:50"; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
function confetti(){
  const em=["💖","✨","🎉","💞","⭐"];
  for(let i=0;i<26;i++){
    const s=document.createElement("div"); s.className="confetti"; s.textContent=em[rnd(em.length)];
    s.style.left=rnd(100)+"vw"; s.style.animationDelay=(Math.random()*.6)+"s"; s.style.fontSize=(16+rnd(16))+"px";
    document.body.appendChild(s); setTimeout(()=>s.remove(),3200);
  }
}

connect();
})();
